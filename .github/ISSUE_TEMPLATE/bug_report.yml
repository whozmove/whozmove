# The form for reporting a bug: what happened, how to make it happen again, and the versions involved.
# Copyright (C) 2026 Satyaraj · SPDX-License-Identifier: GPL-3.0-or-later
name: Bug report
description: Something in the panel or its hooks doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. For a security problem, please don't open an issue: the
        [security policy](https://github.com/whozmove/whozmove/security/policy) says how to report it privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what the panel did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Start a session in Claude Desktop or a terminal
        2. …
  - type: dropdown
    id: where
    attributes:
      label: Where the session runs
      multiple: true
      options:
        - Claude Desktop
        - Ghostty
        - iTerm2
        - Another terminal
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
      placeholder: "26.0"
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: "`claude --version`"
      placeholder: "2.1.270"
    validations:
      required: true
  - type: input
    id: claude-desktop
    attributes:
      label: Claude Desktop version
      description: Claude → About Claude, if the session runs there.
      placeholder: "2.31226.1"
  - type: input
    id: ghostty
    attributes:
      label: Ghostty version
      description: Ghostty → About Ghostty, if the session runs there.
      placeholder: "1.3.1"
  - type: input
    id: iterm2
    attributes:
      label: iTerm2 version
      description: iTerm2 → About iTerm2, if the session runs there.
      placeholder: "3.7.6"
  - type: input
    id: whozmove
    attributes:
      label: Whozmove version or commit
      placeholder: "0.2.0"
  - type: dropdown
    id: installed
    attributes:
      label: How Whozmove was installed
      options:
        - Homebrew
        - From source
  - type: textarea
    id: log
    attributes:
      label: From the log
      description: >-
        The lines around the problem from ~/Library/Application Support/Whozmove/panel.log. Read them before you
        paste: the log holds folder paths, repository and conversation names, and text typed into sessions.
        Take out anything you don't want public.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: If it's something you can see. Check it shows nothing private first.
