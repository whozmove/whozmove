# Makes a release from a pushed version tag (v0.2.0): tools/release.sh builds the app for Apple silicon, signs it with
# the Developer ID, checks it, has Apple notarise it and zips it, all the tests run on the program unpacked from that
# zip, and a draft release gets the zip, with the CHANGELOG's section for the version as its notes, to be published by
# hand. Run by hand (Actions ▸ Release ▸ Run workflow), it makes a trial zip at the version app/Info.plist says, signed
# and notarised the same way, kept with the run, and makes no release. The signing certificate and the notarising key
# are the release environment's secrets, which it gives only to runs from main or a v* tag, so a run by hand works on
# main and on tags only. A tag the release refuses, or whose tests fail, is deleted, fixed and pushed again; a draft
# release left by an earlier run of the same tag is deleted first.
# Copyright (C) 2026 Satyaraj · SPDX-License-Identifier: GPL-3.0-or-later
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    environment: release
    permissions:
      # To make the draft release. Only the last step, which runs for a pushed tag, is given the token.
      contents: write
    steps:
      # Pinned to the commit of a release, as in ci.yml; Dependabot (.github/dependabot.yml) moves the pins. The job
      # pushes nothing, so it doesn't keep the token checkout would otherwise leave for later steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Betterleaks' download, which the build and Keys' tests fetch from GitHub (tools/betterleaks.sh), kept between
      # runs for as long as tools/betterleaks.txt names the same versions. Its checksum is checked each time it's used,
      # so a cached copy can't stand in for another one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Whozmove-build
          key: betterleaks-${{ hashFiles('tools/betterleaks.txt') }}
      # The certificate, in a keychain made for this run in its temporary folder, with a password made here and never
      # kept: its key can't be exported (-x), only codesign may use it (-T), and the partition list lets Apple's tools
      # use it with no one to answer a box. The keychain stays unlocked for the job's length. The notarising key goes
      # beside it. Both are deleted straight after the build, before the tests run anything. The .p12 is read only by
      # macOS's own security tool, which takes the older cipher Keychain Access exports it with; OpenSSL 3 refuses it.
      - name: Put the signing certificate and the notarising key in place
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -x >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "WHOZMOVE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build, check and zip
        id: zip
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=${GITHUB_REF_NAME#v}
            tools/release.sh "$version"
            zip=dist/Whozmove-$version.zip
          else
            version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" app/Info.plist)
            tools/release.sh "$version" --trial
            zip=dist/Whozmove-$version-trial.zip
          fi
          sha=$(shasum -a 256 "$zip" | cut -d' ' -f1)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "zip=$zip" >>"$GITHUB_OUTPUT"
          {
            echo "### $(basename "$zip")"
            echo
            echo "sha256 \`$sha\`"
            echo
            echo "The cask's two lines (Casks/whozmove.rb in the tap):"
            echo
            echo '```ruby'
            echo "  version \"$version\""
            echo "  sha256 \"$sha\""
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Take the signing certificate and the notarising key away
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"
      - name: Tests, on the program from the zip
        run: WHOZMOVE_APP="$PWD/dist/check/Whozmove.app/Contents/MacOS/Whozmove" tests/all.sh
      - name: Keep the trial zip with the run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whozmove-trial
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error
      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          gh release create "v$VERSION" "$ZIP" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Whozmove $VERSION" --notes-file "dist/Whozmove-$VERSION-notes.md"
