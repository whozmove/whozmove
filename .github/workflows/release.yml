# Makes a release from a pushed version tag (v0.2.0): tools/release.sh builds the app for Apple silicon, checks it and
# zips it, all the tests run on the program unpacked from that zip, and a draft release gets the zip, with the
# CHANGELOG's section for the version as its notes, to be published by hand. Run by hand (Actions ▸ Release ▸ Run
# workflow), on a branch or a tag, it makes a trial zip at the version app/Info.plist says, kept with the run, and
# makes no release. A tag the release refuses, or whose tests fail, is deleted, fixed and pushed again; a draft release
# left by an earlier run of the same tag is deleted first.
# Copyright (C) 2026 Satyaraj · SPDX-License-Identifier: GPL-3.0-or-later
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      # To make the draft release. Only the last step, which runs for a pushed tag, is given the token.
      contents: write
    steps:
      # Pinned to the commit of a release, as in ci.yml; Dependabot (.github/dependabot.yml) moves the pins. The job
      # pushes nothing, so it doesn't keep the token checkout would otherwise leave for later steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, check and zip
        id: zip
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=${GITHUB_REF_NAME#v}
            tools/release.sh "$version"
            zip=dist/Whozmove-$version.zip
          else
            version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" app/Info.plist)
            tools/release.sh "$version" --trial
            zip=dist/Whozmove-$version-trial.zip
          fi
          sha=$(shasum -a 256 "$zip" | cut -d' ' -f1)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "zip=$zip" >>"$GITHUB_OUTPUT"
          {
            echo "### $(basename "$zip")"
            echo
            echo "sha256 \`$sha\`"
            echo
            echo "The cask's two lines (Casks/whozmove.rb in the tap):"
            echo
            echo '```ruby'
            echo "  version \"$version\""
            echo "  sha256 \"$sha\""
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Tests, on the program from the zip
        run: WHOZMOVE_APP="$PWD/dist/check/Whozmove.app/Contents/MacOS/Whozmove" tests/all.sh
      - name: Keep the trial zip with the run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whozmove-trial
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error
      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          gh release create "v$VERSION" "$ZIP" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Whozmove $VERSION" --notes-file "dist/Whozmove-$VERSION-notes.md"
